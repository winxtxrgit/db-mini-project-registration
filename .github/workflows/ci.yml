name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt

      # ไม่รัน run.sql ทั้งชุด เพราะ demo.sql ตั้งใจให้ขึ้น error 14 ครั้ง (sqlite3 จะจบด้วย exit 1 เสมอ)
      # กฎใน demo.sql ตรวจแล้วใน tests/test_triggers.py
      - name: Verify schema, seed and reports
        run: |
          sqlite3 :memory: ".read schema.sql" ".read seed.sql" ".read queries.sql" > /dev/null

      - name: Test SQL Triggers & Business Rules (D1-D19)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test Web Application & RBAC
        run: |
          python -m unittest discover -s web -p "test_*.py" -v
