{% extends "base.html" %}
{% block title %}เข้าสู่ระบบ{% endblock %}
{% block content %}
<div class="card" style="max-width:380px;margin:40px auto">
  <h1>เข้าสู่ระบบ</h1>
  <p class="sub">นักศึกษาใช้รหัสนักศึกษาเป็นชื่อผู้ใช้ · บัญชีทดสอบดูได้ใน seed.sql</p>
  <form method="post">
    {{ csrf_field() }}
    <p><label>ชื่อผู้ใช้<br><input name="username" required autofocus autocomplete="username" style="width:100%"></label></p>
    <p><label>รหัสผ่าน<br><input name="password" type="password" required autocomplete="current-password" style="width:100%"></label></p>
    <button class="btn primary">เข้าสู่ระบบ</button>
  </form>
</div>
{% endblock %}
