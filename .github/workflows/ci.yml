name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web/requirements.txt

      - name: Verify SQLite Run Script
        run: |
          sqlite3 < run.sql > /dev/null

      - name: Test SQL Triggers & Business Rules (D1-D19)
        run: |
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test Web Application & RBAC
        run: |
          python -m unittest discover -s web -p "test_*.py" -v
